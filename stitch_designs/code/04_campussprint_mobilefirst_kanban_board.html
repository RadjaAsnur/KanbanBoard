  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><div class="w-7 h-7 bg-primary rounded-lg flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[16px]">terminal</span></div><div class="flex items-center gap-space-xs min-w-0"><span class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate">CampusSprint</span><span class="px-1.5 py-0.5 rounded-lg bg-surface-container font-code-sm text-code-sm text-on-surface-variant font-medium shrink-0">Sprint 04</span></div></div><div class="flex items-center gap-space-sm shrink-0"><div class="flex items-center gap-1 px-2 py-1 rounded-lg bg-surface-container-low"><span class="w-1.5 h-1.5 rounded-full bg-priority-low-text animate-pulse"></span><span class="font-label-sm text-label-sm text-secondary">Synced</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-20 bg-surface"><div class="flex flex-col w-full">
<!-- Top Utility Context Bar -->
<div class="px-margin-mobile pt-3 pb-2 flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface">Sprint Backlog</span>
<span class="px-2 py-0.5 rounded bg-surface-container font-label-sm text-label-sm text-secondary" id="active-sprint-chip">Active</span>
</div>
<div class="flex items-center gap-space-xs">
<button class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-surface-container-low text-secondary active:scale-95 transition-transform" id="btn-seed" title="Reset sample tasks" type="button">
<span class="material-symbols-outlined text-[16px]">refresh</span>
<span class="font-label-sm text-label-sm">Reset</span>
</button>
</div>
</div>
<!-- Mobile Segmented Control Tab Switcher (< 768px) -->
<div class="md:hidden px-margin-mobile mb-3">
<div class="grid grid-cols-3 p-1 rounded-lg bg-surface-container-high gap-1">
<button class="lane-tab flex items-center justify-center gap-1.5 h-8 rounded-lg transition-all text-on-surface font-semibold bg-surface-container-lowest shadow-sm" data-lane="todo" onclick="setActiveLane('todo')" type="button">
<span class="font-label-md text-label-md">To do</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-on-surface font-code-sm text-code-sm" id="tab-count-todo">0</span>
</button>
<button class="lane-tab flex items-center justify-center gap-1.5 h-8 rounded-lg transition-all text-secondary" data-lane="in_progress" onclick="setActiveLane('in_progress')" type="button">
<span class="font-label-md text-label-md">In progress</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-secondary font-code-sm text-code-sm" id="tab-count-in_progress">0</span>
</button>
<button class="lane-tab flex items-center justify-center gap-1.5 h-8 rounded-lg transition-all text-secondary" data-lane="done" onclick="setActiveLane('done')" type="button">
<span class="font-label-md text-label-md">Done</span>
<span class="px-1.5 py-0.2 rounded-full bg-surface-container text-secondary font-code-sm text-code-sm" id="tab-count-done">0</span>
</button>
</div>
</div>
<!-- Main Kanban Board Canvas -->
<div class="px-margin-mobile pb-24 w-full">
<div class="grid grid-cols-1 md:grid-cols-3 gap-space-md items-start">
<!-- COLUMN: TO DO -->
<section class="column-container flex flex-col bg-surface-container-low rounded-lg p-3" id="col-container-todo">
<div class="flex items-center justify-between pb-2 mb-2">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">To do</h2>
</div>
<span class="font-code-sm text-code-sm text-secondary bg-surface-container px-2 py-0.5 rounded-lg" id="badge-count-todo">0</span>
</div>
<div class="flex flex-col gap-space-sm min-h-[120px]" id="lane-todo">
<!-- Injected dynamically -->
</div>
</section>
<!-- COLUMN: IN PROGRESS -->
<section class="column-container flex flex-col bg-surface-container-low rounded-lg p-3" id="col-container-in_progress">
<div class="flex items-center justify-between pb-2 mb-2">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-priority-medium-text"></span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">In progress</h2>
</div>
<span class="font-code-sm text-code-sm text-secondary bg-surface-container px-2 py-0.5 rounded-lg" id="badge-count-in_progress">0</span>
</div>
<div class="flex flex-col gap-space-sm min-h-[120px]" id="lane-in_progress">
<!-- Injected dynamically -->
</div>
</section>
<!-- COLUMN: DONE -->
<section class="column-container flex flex-col bg-surface-container-low rounded-lg p-3" id="col-container-done">
<div class="flex items-center justify-between pb-2 mb-2">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-priority-low-text"></span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Done</h2>
</div>
<span class="font-code-sm text-code-sm text-secondary bg-surface-container px-2 py-0.5 rounded-lg" id="badge-count-done">0</span>
</div>
<div class="flex flex-col gap-space-sm min-h-[120px]" id="lane-done">
<!-- Injected dynamically -->
</div>
</section>
</div>
</div>
<!-- Persistent Floating Action Button (FAB) -->
<button class="fixed bottom-20 right-4 z-40 flex items-center justify-center gap-1.5 px-4 h-12 bg-primary text-on-primary rounded-full shadow-md active:scale-95 transition-transform" id="btn-fab-add" onclick="openAddTaskModal()" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
<span class="font-label-md text-label-md font-semibold tracking-wide">New Task</span>
</button>
<!-- Add Task Modal Dialog Overlay -->
<div class="fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden" id="modal-backdrop">
<div class="w-full sm:max-w-md bg-surface-container-lowest rounded-t-xl sm:rounded-xl p-5 shadow-xl transition-all" id="modal-panel">
<div class="flex items-center justify-between pb-3 mb-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface text-[20px]">task_alt</span>
<h3 class="font-headline-md text-headline-md text-on-surface">New Sprint Task</h3>
</div>
<button class="w-8 h-8 rounded-lg flex items-center justify-center bg-surface-container-low text-secondary active:scale-95" onclick="closeAddTaskModal()" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<form class="flex flex-col gap-space-md" id="form-add-task" onsubmit="handleCreateTask(event)">
<!-- Title Input -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-secondary" for="input-task-title">Task Title</label>
<input autocomplete="off" class="h-10 px-3 bg-surface-container-low text-on-surface font-body-sm text-body-sm rounded-lg focus:outline-none focus:bg-surface-container" id="input-task-title" placeholder="e.g. Implement refresh token interceptor" required=""/>
</div>
<!-- Priority Radio Pills -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-secondary">Priority Level</label>
<div class="grid grid-cols-3 gap-2" id="priority-selector">
<button class="priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-priority-high-bg text-priority-high-text ring-2 ring-destructive" data-val="HIGH" onclick="selectPriority('HIGH')" type="button">
              HIGH
            </button>
<button class="priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-surface-container-low text-secondary" data-val="MEDIUM" onclick="selectPriority('MEDIUM')" type="button">
              MEDIUM
            </button>
<button class="priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-surface-container-low text-secondary" data-val="LOW" onclick="selectPriority('LOW')" type="button">
              LOW
            </button>
</div>
<input id="input-priority" type="hidden" value="HIGH"/>
</div>
<!-- Course Tag & Due Date Row -->
<div class="grid grid-cols-2 gap-2">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-secondary" for="input-task-tag">Course / Module</label>
<select class="h-10 px-2.5 bg-surface-container-low text-on-surface font-body-sm text-body-sm rounded-lg focus:outline-none" id="input-task-tag">
<option value="CS-301">CS-301 (Algorithms)</option>
<option value="SE Project">SE Project</option>
<option value="Backend">Backend</option>
<option value="UI/UX">UI/UX</option>
<option value="DevOps">DevOps</option>
<option value="Personal">Personal</option>
</select>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-secondary" for="input-task-due">Due Horizon</label>
<select class="h-10 px-2.5 bg-surface-container-low text-on-surface font-body-sm text-body-sm rounded-lg focus:outline-none" id="input-task-due">
<option value="Today">Today</option>
<option selected="" value="Tomorrow">Tomorrow</option>
<option value="Oct 26">Oct 26</option>
<option value="Oct 28">Oct 28</option>
<option value="Next sprint">Next sprint</option>
</select>
</div>
</div>
<!-- Action Row -->
<div class="flex items-center justify-end gap-2 pt-2">
<button class="h-10 px-4 rounded-lg bg-surface-container-low text-secondary font-label-md text-label-md active:scale-95" onclick="closeAddTaskModal()" type="button">
            Cancel
          </button>
<button class="h-10 px-5 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold active:scale-95 shadow-sm" type="submit">
            Create Task
          </button>
</div>
</form>
</div>
</div>
</div>
<script>
(function() {
  const STORAGE_KEY = 'campusSprint_tasks';
  let activeLane = 'todo';

  const defaultTasks = [
    {
      id: 'task-1',
      title: 'Wireframe low-fi auth flow in Figma',
      status: 'todo',
      priority: 'HIGH',
      due: 'Tomorrow',
      tag: 'UI/UX'
    },
    {
      id: 'task-2',
      title: 'Set up Supabase client & schemas',
      status: 'todo',
      priority: 'HIGH',
      due: 'Oct 25',
      tag: 'Backend'
    },
    {
      id: 'task-3',
      title: 'Implement JWT token refresh interceptor',
      status: 'in_progress',
      priority: 'MEDIUM',
      due: 'Oct 27',
      tag: 'CS-301'
    },
    {
      id: 'task-4',
      title: 'Review Git PR #14: CI test pipeline',
      status: 'done',
      priority: 'LOW',
      due: 'Yesterday',
      tag: 'DevOps'
    }
  ];

  function loadTasks() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultTasks));
        return defaultTasks;
      }
      return JSON.parse(data);
    } catch (e) {
      return defaultTasks;
    }
  }

  function saveTasks(tasks) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {}
  }

  function getPriorityBadge(priority) {
    if (priority === 'HIGH') {
      return '<span class="px-2 py-0.5 rounded-lg font-label-sm text-label-sm font-semibold bg-priority-high-bg text-priority-high-text">HIGH</span>';
    } else if (priority === 'MEDIUM') {
      return '<span class="px-2 py-0.5 rounded-lg font-label-sm text-label-sm font-semibold bg-priority-medium-bg text-priority-medium-text">MED</span>';
    } else {
      return '<span class="px-2 py-0.5 rounded-lg font-label-sm text-label-sm font-semibold bg-priority-low-bg text-priority-low-text">LOW</span>';
    }
  }

  window.setActiveLane = function(lane) {
    activeLane = lane;
    const tabs = document.querySelectorAll('.lane-tab');
    tabs.forEach(tab => {
      const tabLane = tab.getAttribute('data-lane');
      if (tabLane === lane) {
        tab.className = 'lane-tab flex items-center justify-center gap-1.5 h-8 rounded-lg transition-all text-on-surface font-semibold bg-surface-container-lowest shadow-sm';
      } else {
        tab.className = 'lane-tab flex items-center justify-center gap-1.5 h-8 rounded-lg transition-all text-secondary';
      }
    });

    const isMobile = window.innerWidth < 768;
    const lanes = ['todo', 'in_progress', 'done'];
    lanes.forEach(l => {
      const colEl = document.getElementById('col-container-' + l);
      if (colEl) {
        if (isMobile) {
          if (l === activeLane) {
            colEl.classList.remove('hidden');
          } else {
            colEl.classList.add('hidden');
          }
        } else {
          colEl.classList.remove('hidden');
        }
      }
    });
  };

  window.moveTask = function(taskId, nextStatus) {
    const tasks = loadTasks();
    const task = tasks.find(t => t.id === taskId);
    if (task) {
      task.status = nextStatus;
      saveTasks(tasks);
      renderBoard();
    }
  };

  window.deleteTask = function(taskId) {
    let tasks = loadTasks();
    tasks = tasks.filter(t => t.id !== taskId);
    saveTasks(tasks);
    renderBoard();
  };

  window.selectPriority = function(val) {
    document.getElementById('input-priority').value = val;
    const buttons = document.querySelectorAll('.priority-opt');
    buttons.forEach(btn => {
      const opt = btn.getAttribute('data-val');
      if (opt === val) {
        if (val === 'HIGH') {
          btn.className = 'priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-priority-high-bg text-priority-high-text ring-2 ring-destructive';
        } else if (val === 'MEDIUM') {
          btn.className = 'priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-priority-medium-bg text-priority-medium-text ring-2 ring-priority-medium-text';
        } else {
          btn.className = 'priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-priority-low-bg text-priority-low-text ring-2 ring-priority-low-text';
        }
      } else {
        btn.className = 'priority-opt h-9 rounded-lg font-label-sm text-label-sm font-semibold transition-all bg-surface-container-low text-secondary';
      }
    });
  };

  window.openAddTaskModal = function() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('hidden');
    document.getElementById('input-task-title').focus();
  };

  window.closeAddTaskModal = function() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.add('hidden');
    document.getElementById('form-add-task').reset();
    selectPriority('HIGH');
  };

  window.handleCreateTask = function(e) {
    e.preventDefault();
    const title = document.getElementById('input-task-title').value.trim();
    if (!title) return;

    const priority = document.getElementById('input-priority').value || 'HIGH';
    const tag = document.getElementById('input-task-tag').value;
    const due = document.getElementById('input-task-due').value;

    const newTask = {
      id: 'task-' + Date.now(),
      title: title,
      status: 'todo',
      priority: priority,
      due: due,
      tag: tag
    };

    const tasks = loadTasks();
    tasks.unshift(newTask);
    saveTasks(tasks);

    closeAddTaskModal();
    if (window.innerWidth < 768) {
      window.setActiveLane('todo');
    }
    renderBoard();
  };

  function renderCard(task) {
    let actionButtons = '';

    if (task.status === 'todo') {
      actionButtons = `
        <button type="button" class="w-full h-10 px-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-1 active:scale-95 transition-transform" onclick="moveTask('${task.id}', 'in_progress')">
          <span>Start Sprint</span>
          <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
        </button>
      `;
    } else if (task.status === 'in_progress') {
      actionButtons = `
        <div class="grid grid-cols-2 gap-2 w-full">
          <button type="button" class="h-10 px-2 rounded-lg bg-surface-container-low text-secondary font-label-md text-label-md flex items-center justify-center gap-1 active:scale-95 transition-transform" onclick="moveTask('${task.id}', 'todo')">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            <span>Revert</span>
          </button>
          <button type="button" class="h-10 px-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center justify-center gap-1 active:scale-95 transition-transform" onclick="moveTask('${task.id}', 'done')">
            <span>Done</span>
            <span class="material-symbols-outlined text-[16px]">check</span>
          </button>
        </div>
      `;
    } else if (task.status === 'done') {
      actionButtons = `
        <div class="flex items-center justify-between w-full gap-2">
          <button type="button" class="h-10 px-3 rounded-lg bg-surface-container-low text-secondary font-label-md text-label-md flex items-center gap-1 active:scale-95 transition-transform" onclick="moveTask('${task.id}', 'in_progress')">
            <span class="material-symbols-outlined text-[16px]">undo</span>
            <span>Reopen</span>
          </button>
          <button type="button" class="h-10 w-10 rounded-lg bg-error-container text-on-error-container flex items-center justify-center active:scale-95 transition-transform" onclick="deleteTask('${task.id}')" title="Delete Task">
            <span class="material-symbols-outlined text-[18px]">delete</span>
          </button>
        </div>
      `;
    }

    return `
      <article class="bg-surface-container-lowest rounded-lg p-3.5 shadow-sm flex flex-col justify-between gap-3">
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              ${getPriorityBadge(task.priority)}
              <span class="px-2 py-0.5 rounded-lg font-code-sm text-code-sm bg-surface-container text-secondary">${task.tag}</span>
            </div>
            <div class="flex items-center gap-1 text-secondary">
              <span class="material-symbols-outlined text-[14px]">schedule</span>
              <span class="font-label-sm text-label-sm">${task.due}</span>
            </div>
          </div>
          <h3 class="font-body-md text-body-md text-on-surface font-medium leading-snug line-clamp-2">
            ${task.title}
          </h3>
        </div>
        <div class="pt-1">
          ${actionButtons}
        </div>
      </article>
    `;
  }

  function renderBoard() {
    const tasks = loadTasks();
    const todoTasks = tasks.filter(t => t.status === 'todo');
    const inProgressTasks = tasks.filter(t => t.status === 'in_progress');
    const doneTasks = tasks.filter(t => t.status === 'done');

    // Update Counts in Badges and Mobile Segmented Bar
    document.getElementById('badge-count-todo').textContent = todoTasks.length;
    document.getElementById('badge-count-in_progress').textContent = inProgressTasks.length;
    document.getElementById('badge-count-done').textContent = doneTasks.length;

    document.getElementById('tab-count-todo').textContent = todoTasks.length;
    document.getElementById('tab-count-in_progress').textContent = inProgressTasks.length;
    document.getElementById('tab-count-done').textContent = doneTasks.length;

    // Render lanes
    const renderList = (containerId, list, emptyText) => {
      const el = document.getElementById(containerId);
      if (list.length === 0) {
        el.innerHTML = `
          <div class="flex flex-col items-center justify-center p-6 text-center rounded-lg bg-surface-container-lowest">
            <span class="material-symbols-outlined text-secondary text-[24px] mb-1">inbox</span>
            <p class="font-label-sm text-label-sm text-secondary">${emptyText}</p>
          </div>
        `;
      } else {
        el.innerHTML = list.map(t => renderCard(t)).join('');
      }
    };

    renderList('lane-todo', todoTasks, 'No backlog tasks. Tap + to add.');
    renderList('lane-in_progress', inProgressTasks, 'No active work in progress.');
    renderList('lane-done', doneTasks, 'No completed tasks yet.');

    window.setActiveLane(activeLane);
  }

  // Bind Seeding Reset
  document.getElementById('btn-seed').addEventListener('click', () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultTasks));
    renderBoard();
  });

  // Responsive column sync on viewport resize
  window.addEventListener('resize', () => {
    window.setActiveLane(activeLane);
  });

  // Initial render on boot
  renderBoard();
})();
